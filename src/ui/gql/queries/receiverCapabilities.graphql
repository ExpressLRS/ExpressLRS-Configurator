query receiverCapabilities(
  $target: String!,
  $source: FirmwareSource!,
  $gitTag: String!,
  $gitBranch: String!,
  $gitCommit: String!,
  $localPath: String!,
  $gitPullRequest: PullRequestInput,
  $gitRepository: GitRepositoryInput!,
) {
  receiverCapabilities(
    target: $target,
    source: $source,
    gitTag: $gitTag,
    gitBranch: $gitBranch,
    gitCommit: $gitCommit,
    localPath: $localPath,
    gitPullRequest: $gitPullRequest,
    gitRepository: $gitRepository,
  ) {
    supported
    powerMin
    powerMax
    powerDefault
    hasSerial1
    pwmChannelCount
    dualRadio
    hasAntennaSwitch
  }
}
