overwrite: true
# Start the app with `API_AUTH_TOKEN=<token> npm start` and run codegen with the same variable
schema:
  - 'http://127.0.0.1:3500/graphql':
      headers:
        Authorization: 'Bearer ${API_AUTH_TOKEN}'
generates:
  src/ui/gql/generated/types.ts:
    documents:
      - './src/ui/**/*.graphql'
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typed-document-node'
    config:
      immutableTypes: true
      namingConvention:
        enumValues: 'keep'

  graphql.schema.json:
    plugins:
      - 'introspection'
